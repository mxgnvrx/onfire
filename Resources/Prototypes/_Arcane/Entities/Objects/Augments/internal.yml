- type: entity
  parent: BaseAugment
  id: NutrimentPumpAugment
  name: nutriment pump augment
  description: A chest implant that synthesizes nutrition when its owner is starving.
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Species/Cybernetics/organs.rsi
    state: nutriment_implant
  - type: Organ
    slotId: nutrimentPump
  - type: Cybernetics
  - type: NutrimentPump

- type: entity
  parent: NutrimentPumpAugment
  id: NutrimentPumpPlusAugment
  name: nutriment pump PLUS augment
  description: An improved chest implant that synthesizes nutrition as soon as its owner is peckish.
  components:
  - type: Sprite
    state: adv_nutriment_implant
  - type: NutrimentPump
    threshold: Peckish

- type: entity
  parent: BaseAugment
  id: BreathingTubeAugment
  name: breathing tube augment
  description: An implanted internals connector that allows its owner to breathe from a tank without a mask.
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Species/Cybernetics/organs.rsi
    state: implant_mask
  - type: Organ
    slotId: breathingTube
  - type: Cybernetics
  - type: BreathingTube
  - type: BreathMask
  - type: Item
    size: Tiny

- type: entity
  parent: BaseAugment
  id: AntiDropAugment
  name: anti-drop implant
  description: A brain implant that contracts the hand muscles to hold onto carried items. Twitch your ear to relax your grip.
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Species/Cybernetics/organs.rsi
    state: brain_implant_antidrop
  - type: Organ
    slotId: cerebellumImplant
  - type: Cybernetics
  - type: BrainImplant
  - type: AntiDrop
  - type: Item
    size: Tiny

- type: entity
  parent: BaseAugment
  id: CnsRebooterAugment
  name: CNS rebooter implant
  description: A brain implant that automatically restores control of the central nervous system after a stun. It briefly resists further stuns and injury-induced sluggishness before recharging.
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Species/Cybernetics/organs.rsi
    state: brain_implant_rebooter
  - type: Organ
    slotId: cnsImplant
  - type: Cybernetics
  - type: BrainImplant
  - type: CnsRebooter
  - type: Item
    size: Tiny

- type: entity
  parent: BaseAction
  id: ActionToggleAntiDrop
  name: Toggle grip lock
  description: Contract or relax your hand muscles to retain or release the items you are holding.
  components:
  - type: Action
    icon:
      sprite: _Arcane/Mobs/Species/Cybernetics/organs.rsi
      state: brain_implant_antidrop
    useDelay: 0.5
  - type: InstantAction
    event: !type:ToggleActionEvent
