    parts: [ Chest ]
  - type: SurgeryOrganSlotCondition
    organSlot: nutrimentPump

- type: entity
  parent: SurgeryInstallAugmentBase
  id: SurgeryInsertNutrimentPump
  name: Insert nutriment pump
  components:
