name: Gemini Code Mirror

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name'
        required: true
        default: 'bunch-of-fixes-3'
      base_branch:
        description: 'Base branch to compare against'
        required: true
        default: 'master'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0 # Подтягиваем всю историю

      - name: Create lightweight review branch
        run: |
          # Добавляем оригинальный репозиторий (upstream) и скачиваем его свежий master напрямую
          git remote add upstream https://github.com/ArcaneSS14/arcane.git || true
          git fetch upstream "${{ inputs.base_branch }}"

          # 1. Генерируем полный diff относительно свежего upstream/master
          git diff "upstream/${{ inputs.base_branch }}...HEAD" -- . \
            ':!Resources/Textures' \
            ':!Resources/Audio' \
            ':!Resources/ServerInfo' \
            ':!Resources/Maps' \
            ':!Resources/Fonts' \
            ':!BuildFiles' > /tmp/PR_DIFF_AGAINST_MASTER.md

          # 2. Получаем список только тех файлов, которые были добавлены или изменены
          git diff --name-only --diff-filter=ACMR "upstream/${{ inputs.base_branch }}...HEAD" -- . \
            ':!Resources/Textures' \
            ':!Resources/Audio' \
            ':!Resources/ServerInfo' \
            ':!Resources/Maps' \
            ':!Resources/Fonts' \
            ':!BuildFiles' > /tmp/changed_files.txt

          # 3. Создаем чистую ветку и полностью очищаем индекс от тысяч файлов SS14
          git checkout --orphan "code-${{ inputs.branch }}"
          git rm -rf --cached .
          git clean -fd

          # 4. Возвращаем в ветку ТОЛЬКО измененные файлы (используем origin/ветка для надежности)
          if [ -s /tmp/changed_files.txt ]; then
            tr '\n' '\0' < /tmp/changed_files.txt | xargs -0 git checkout "origin/${{ inputs.branch }}" --
          fi

          # 5. Кладем в корень файл с diff'ом, чтобы Gemini видел сравнение с master
          cp /tmp/PR_DIFF_AGAINST_MASTER.md ./PR_DIFF_AGAINST_MASTER.md
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean PR mirror for Gemini"
          git push -f origin "code-${{ inputs.branch }}"
          
