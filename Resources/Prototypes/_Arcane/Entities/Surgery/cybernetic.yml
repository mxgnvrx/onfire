- type: entity
  parent: SurgeryOpenCavityBase
  id: SurgeryOpenBreathingTubeCavity
  name: Open cavity for breathing tube
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganSlotCondition
    organSlot: breathingTube
  - type: SurgeryBodyCondition
    accepted: [ IPC ]
    inverse: true

- type: entity
  parent: SurgeryInstallAugmentBase
  id: SurgeryInsertBreathingTube
  name: Insert breathing tube
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepInsertOrgan
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganSlotCondition
    organSlot: breathingTube
  - type: SurgeryOrganCondition
    organ:
    - type: BreathingTube

