- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonCnsRebooter
  name: syndicate autosurgeon (CNS rebooter)
  components:
  - type: AutoSurgeon
    targetBodyPart: Head
    targetOrgan: cnsImplant
    newPartProto: CnsRebooterAugment

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonReviver
  name: syndicate autosurgeon (reviver)
  components:
  - type: AutoSurgeon
    targetBodyPart: Chest
    targetOrgan: heartImplant
    newPartProto: ReviverAugment

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonLeftLaserArm
  name: syndicate autosurgeon (left arm laser)
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Left
    targetOrgan: armImplant
    newPartProto: LaserArmAugment

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonRightLaserArm
  name: syndicate autosurgeon (right arm laser)
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Right
    targetOrgan: armImplant
    newPartProto: LaserArmAugment
