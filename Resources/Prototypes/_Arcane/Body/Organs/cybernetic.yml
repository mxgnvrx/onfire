    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 0
  - type: Metabolizer
    maxPoisonsProcessable: 3
    metabolizerTypes: [ Cybernetic ]
    groups:
    - id: Food
      rateModifier: 0.7
    - id: Drink
      rateModifier: 0.7
  - type: Tag
    tags: [ Organ, Stomach ]
  - type: Item
    size: Small
    heldPrefix: stomach

